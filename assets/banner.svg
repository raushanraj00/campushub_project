<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 { animation: pulse 6s ease-in-out infinite alternate; transform-origin: 220px 120px; }
      .orb-2 { animation: pulse 8s ease-in-out infinite alternate 2s; transform-origin: 980px 300px; }
      .floating-title { animation: float 5s ease-in-out infinite; }
      .border-pulse { stroke-dasharray: 200 40; animation: shimmer 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="300" r="180" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="210" r="260" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />

  <!-- High-Tech Tech Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" />
  </g>

  <!-- Outer Neon Border Frame -->
  <rect class="border-pulse" x="4" y="4" width="1192" height="412" rx="20" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" opacity="0.85" />

  <!-- Central Content -->
  <g class="floating-title" text-anchor="middle">
    <!-- Badge Pill -->
    <rect x="430" y="46" width="340" height="34" rx="17" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5" />
    <text x="600" y="69" fill="#38bdf8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      ENTERPRISE UNIVERSITY SYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="150" fill="url(#accent-grad)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="3" filter="url(#glow)">
      CAMPUSHUB ERP
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" fill="#f8fafc" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">
      Next-Gen Dual-Engine University Management Platform
    </text>

    <!-- Tech Stack Tagline -->
    <text x="600" y="232" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="500">
      Java 17 &amp; Spring Boot 3 &bull; Modern Swing GUI &bull; MySQL 8.0 &bull; 60 FPS Micro-Interactions
    </text>

    <!-- Divider Line -->
    <line x1="350" y1="262" x2="850" y2="262" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.6" />

    <!-- Feature Pills -->
    <g transform="translate(240, 282)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#4f46e5" stroke-width="1" />
      <text x="80" y="22" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Dual MVC Architecture</text>
      
      <rect x="180" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="260" y="22" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">4 OOP Pillars in Action</text>

      <rect x="360" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="450" y="22" fill="#fcd34d" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">287 Verified User Profiles</text>

      <rect x="560" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="640" y="22" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Realtime Multithreading</text>
    </g>

    <!-- Author & Attribution -->
    <g transform="translate(0, 360)">
      <text x="600" y="20" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600">
        Engineered with passion by <tspan fill="#38bdf8" font-weight="800">Raushan Raj</tspan> &bull; UID: <tspan fill="#fbbf24" font-weight="700">25BCS13241</tspan> &bull; Chandigarh University
      </text>
    </g>
  </g>
</svg>